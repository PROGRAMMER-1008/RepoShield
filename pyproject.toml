[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reposhield"
version = "0.2.1"
description = "Deterministic verification and control layer for AI-generated code changes"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pydantic>=2,<3"]

[project.optional-dependencies]
runner = ["pytest>=8", "coverage>=7"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "SQLAlchemy>=2,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "cryptography>=46,<48"]
dev = ["pytest>=8", "coverage>=7", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "SQLAlchemy>=2,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "cryptography>=46,<48"]

[project.scripts]
reposhield = "reposhield.cli:main"
reposhield-worker = "reposhield.server.process_worker:main"
reposhield-db = "reposhield.server.admin:main"
reposhield-broker = "reposhield.broker:main"
reposhield-github = "reposhield.server.github_worker:main"

[tool.setuptools.packages.find]
include = ["reposhield*"]

[tool.setuptools.package-data]
reposhield = ["plugin/*.py", "demo_data/main/**/*", "demo_data/main/.reposhield.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
